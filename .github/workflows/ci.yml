name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app (check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  rook-node:
    name: Rook Node (check + tests + Chromium smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rook-node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rook-node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps
      - run: pnpm typecheck
      # GitHub reporter surfaces failures as public annotations.
      - run: pnpm test -- --reporter=github

  tauri-shell:
    name: Tauri shell (cargo check)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rook-node/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rook-node/src-tauri
      # tauri-build's build script validates that the externalBin and resources
      # exist; stage placeholders so `cargo check` can run without a full build.
      - name: Stage sidecar placeholder for tauri-build
        shell: bash
        run: |
          mkdir -p src-tauri/binaries src-tauri/resources/chromium
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "placeholder" > src-tauri/binaries/rook-node-x86_64-pc-windows-msvc.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "placeholder" > src-tauri/binaries/rook-node-aarch64-apple-darwin
          else
            echo "placeholder" > src-tauri/binaries/rook-node-x86_64-unknown-linux-gnu
          fi
          echo "placeholder" > src-tauri/resources/chromium/.keep
      - run: cargo check