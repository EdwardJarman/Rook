name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app (check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  rook-node:
    name: Rook Node (check + tests + Chromium smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rook-node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rook-node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium --with-deps
      - run: pnpm typecheck
      - name: Test
        id: nodetest
        shell: bash
        run: |
          pnpm test 2>&1 | tee /tmp/vitest.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Surface test failures
        if: steps.nodetest.outcome == 'failure'
        shell: bash
        run: |
          grep -aE "FAIL|AssertionError|Error|✗|×" /tmp/vitest.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
          tail -12 /tmp/vitest.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

  tauri-shell:
    name: Tauri shell (cargo check)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rook-node/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rook-node/src-tauri
      # tauri-build's build script validates that the externalBin and resources
      # exist; stage placeholders so `cargo check` can run without a full build.
      # NOTE: this job runs from rook-node/src-tauri, so paths are relative to it.
      - name: Stage sidecar placeholder for tauri-build
        shell: bash
        run: |
          mkdir -p binaries resources/chromium ../dist-app
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "placeholder" > binaries/rook-node-sidecar-x86_64-pc-windows-msvc.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "placeholder" > binaries/rook-node-sidecar-aarch64-apple-darwin
          else
            echo "placeholder" > binaries/rook-node-sidecar-x86_64-unknown-linux-gnu
          fi
          echo "placeholder" > resources/chromium/.keep
          # tauri::generate_context! validates frontendDist exists at compile
          # time even for `cargo check`, so stage a minimal dist-app too.
          echo "<!doctype html><title>placeholder</title>" > ../dist-app/index.html
          ls -la binaries resources/chromium ../dist-app
      - name: cargo check
        id: cargochk
        shell: bash
        run: |
          cargo check 2>&1 | tee /tmp/cargo-check.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Surface cargo errors
        if: steps.cargochk.outcome == 'failure'
        shell: bash
        run: |
          tail -8 /tmp/cargo-check.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1