name: Push InstantDB schema

# Registers new entities (e.g. rookNodes, pairingTokens, nodeCommands) in the
# production InstantDB backend. Run manually from the Actions tab after
# changing instant.schema.ts. Requires one-time setup of repository secrets:
#   INSTANT_APP_ID            = ed69763d-c8a4-4a28-8bed-c13806f2493d
#   INSTANT_APP_ADMIN_TOKEN   = value from Vercel project env vars

on:
  workflow_dispatch:

jobs:
  push-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push schema to InstantDB
        env:
          INSTANT_APP_ID: ${{ secrets.INSTANT_APP_ID }}
          INSTANT_APP_ADMIN_TOKEN: ${{ secrets.INSTANT_APP_ADMIN_TOKEN }}
        run: pnpm exec instant-cli push schema --app "$INSTANT_APP_ID" --token "$INSTANT_APP_ADMIN_TOKEN" --yes