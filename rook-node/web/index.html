<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rook Node</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f5f1;
        color: #1a1d23;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #fff;
        border: 1px solid #e9e8e2;
        border-radius: 20px;
        padding: 34px 38px;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { font-size: 14px; line-height: 1.5; margin: 8px 0; color: #4a4d55; }
      .muted { color: #8a887f; font-size: 12.5px; }
      .btn {
        display: inline-block; margin-top: 14px; background: #1a1d23; color: #fff;
        text-decoration: none; padding: 11px 22px; border-radius: 12px;
        font-weight: 600; font-size: 14px; cursor: pointer; border: none;
      }
      .btn[disabled] { opacity: 0.5; cursor: default; }
      .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; margin-top: 10px; }
      .on { background: #e4f3ea; color: #1d7a46; }
      .off { background: #efeee9; color: #6b6a63; }
      .warn { background: #fdf0d7; color: #9a6b0f; }
      .retry {
        margin-top: 10px; background: transparent; border: 1px solid #d8d6cf;
        border-radius: 10px; padding: 7px 16px; font-size: 13px; cursor: pointer; color: #4a4d55;
      }
      .retry:hover { background: #f1f0ea; }
      .retry[disabled] { opacity: 0.5; cursor: default; }
      code {
        font-size: 12px; background: #f1f0ea; border-radius: 6px;
        padding: 2px 6px; user-select: all; word-break: break-all;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Rook Node</h1>
      <p>Your computer, as a Bot computer for Rook. Forever free.</p>
      <span id="status" class="pill warn">Starting…</span>
      <div><button id="connect" class="btn" disabled>Connect account</button></div>
      <button id="retry" class="retry" hidden>Retry</button>
      <p class="muted" id="error"></p>
      <p class="muted" id="manual" hidden>Or open this in your browser:<br /><code id="manualUrl"></code></p>
      <p class="muted" id="hint">Connecting opens your browser and comes right back.</p>
    </div>
    <!-- External script on purpose: the packaged CSP whitelists inline scripts
         via build-time hashes, which can silently mismatch and kill the page.
         A same-origin file only needs default-src 'self'. -->
    <script src="./app.js"></script>
  </body>
</html>
